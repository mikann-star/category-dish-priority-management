.modal{position:relative;display:flex;flex-direction:column;width:calc(100% - 64px);max-width:1420px;height:calc(100dvh - 48px);min-height:450px;margin:24px auto;background:#fff;border:1px solid #ffffff99;border-radius:24px;box-shadow:0 28px 85px #21213a26;overflow:hidden}.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:30px 40px 23px;gap:20px}.modal-header h1{margin:0 0 10px;font-size:25px;letter-spacing:.3px;font-weight:700}.modal-header p{margin:0;color:#9295b0;font-size:13px}.icon-button{background:transparent;border:0;padding:7px;color:#8c92b3;display:inline-flex;align-items:center;justify-content:center;border-radius:7px}.icon-button:hover{color:var(--primary);background:#f1eeff}.close svg{width:24px;height:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 40px 22px}.toolbar-title{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:600}.count{font-size:12px;padding:4px 9px;border-radius:6px;background:#f1f0f8;color:#8385a3;font-weight:500}.toolbar-note{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e2e2ee;border-radius:9px;padding:11px 18px;background:#fff;color:var(--ink);font-weight:500;white-space:nowrap}.button:hover{background:#f6f5fc}.button.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 9px #4824f522}.button.primary:hover{background:var(--primary-dark)}.button.primary:disabled{background:#b8acf9;border-color:#b8acf9;box-shadow:none}.button.small{padding:8px 12px;font-size:12px}.button svg{width:17px;height:17px}.table-shell{margin:0 40px;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:auto;scrollbar-width:thin;scrollbar-color:#d0cde1 transparent}.category-grid{display:grid;grid-template-columns:36px 100px minmax(160px,1fr) minmax(175px,1.05fr) 100px 200px;align-items:center;gap:16px;padding:0 24px}.table-head{height:52px;background:#fafafd;color:#999db9;font-size:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.category{border-bottom:1px solid var(--line)}.category:last-child{border-bottom:0}.category-row{min-height:75px;background:#fff;position:relative}.category.open>.category-row{background:#f8f7ff}.category-name{font-weight:600;font-size:14px;color:inherit;text-align:left;padding:14px 0;line-height:1.6}.en-name{font-size:13px;color:#8286a5;line-height:1.6}.row-controls{display:flex;align-items:center;gap:6px}.handle{cursor:grab;touch-action:none;color:#b7b8cb;padding:5px 3px;background:transparent;border:0;border-radius:4px;display:inline-flex}.handle:active{cursor:grabbing}.handle:hover{color:var(--primary);background:#ede9ff}.handle svg{width:15px;height:20px}.dish-toggle{display:inline-flex;align-items:center;gap:6px}.dish-toggle svg{width:14px;height:14px;transform:rotate(90deg);transition:transform .15s}.dish-toggle[aria-expanded="true"] svg{transform:rotate(-90deg)}.priority{width:58px;height:32px;padding:4px 8px;text-align:center;border:1px solid #e1dfed;border-radius:6px;background:#fff;color:#626389;font-variant-numeric:tabular-nums;-moz-appearance:textfield}.priority::-webkit-inner-spin-button,.priority::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.priority:hover{border-color:#b9acf4}.priority:focus{border-color:var(--primary);outline:3px solid #eeeaff}.dish-count{display:flex;align-items:center;gap:12px}.dish-count strong{font-size:14px;font-weight:500;min-width:12px}.text-button{border:0;background:none;color:var(--primary);font-size:12px;padding:6px 0;white-space:nowrap}.text-button:hover{text-decoration:underline}.operations{display:flex;align-items:center;gap:12px}.operations .edit{color:#6680ff}.operations .delete{color:#bfc2d5}.operations button:disabled{opacity:.48;background:transparent}.dish-panel{padding:0 24px 20px 76px;background:#f8f7ff}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:9px 0 14px}.panel-heading{display:flex;gap:8px;align-items:center;color:#656084;font-size:13px;font-weight:600}.panel-heading svg{width:16px;height:16px;color:#8c80cb}.panel-subtitle{font-size:12px;color:#9b96b2;margin-top:7px}.dish-table{border:1px solid #e9e5f5;border-radius:9px;overflow:hidden;background:#fff}.dish-grid{display:grid;grid-template-columns:32px 100px minmax(150px,1fr) minmax(170px,1.05fr) 84px;align-items:center;gap:16px;padding:0 20px}.dish-head{height:38px;background:#fbfaff;font-size:11px;color:#a09bb7}.dish-row{min-height:56px;border-top:1px solid #f0edf7;background:#fff;position:relative}.dish-row:hover{background:#fdfcff}.dish-name{font-size:13px;font-weight:500}.dish-english{font-size:12px;color:#9a9ab2}.dish-row .priority{height:29px;width:52px;font-size:12px}.dish-row .text-button{font-size:11px;color:#9a93b8;text-align:left}.dish-row .text-button:hover{color:var(--primary)}.dish-row .text-button:disabled{color:#d0ccdc;text-decoration:none}.empty{padding:32px;text-align:center;color:#9c98b1;font-size:13px}.drop-before{box-shadow:inset 0 3px var(--primary)!important}.drop-after{box-shadow:inset 0 -3px var(--primary)!important}.dragging{opacity:.35}.changed-row{animation:flash 1.2s ease-out}@keyframes flash{from{background:#eae3ff}to{background:#fff}}
.footer{padding:19px 40px 23px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:white}.save-status{display:flex;align-items:center;gap:8px;color:#9396ae;font-size:12px}.status-dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:#a9adbf}.save-status.error .status-dot{background:#df675f}.save-status.saved .status-dot{background:#38aa85}.toast{position:fixed;left:50%;bottom:108px;transform:translate(-50%,15px);padding:12px 20px;background:#33304c;color:#fff;border-radius:9px;box-shadow:0 8px 28px #29243b25;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 40px);line-height:1.6}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;border-radius:16px;padding:0;width:440px;max-width:calc(100% - 32px);color:var(--ink);box-shadow:0 24px 90px #25213c33}dialog::backdrop{background:#25233e66;backdrop-filter:blur(2px)}.dialog-content{padding:28px}.dialog-content h2{font-size:20px;margin:0 0 12px}.dialog-content p{font-size:13px;color:#9894aa;line-height:1.8;margin:0 0 22px}.field{display:block;font-size:13px;margin:18px 0}.field input{margin-top:9px;width:100%;padding:11px 12px;border:1px solid #dedbea;border-radius:7px;color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.reopen{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#e9e8f0}.closed .modal,.closed .backdrop{display:none}.closed .reopen{display:flex}
@media(min-width:1600px){.modal{margin:32px auto;height:calc(100dvh - 64px)}}@media(max-width:1000px){.modal{width:calc(100% - 24px);margin:12px auto;height:calc(100dvh - 24px)}.modal-header{padding:25px 24px 20px}.toolbar{padding:4px 24px 20px}.table-shell{margin:0 24px}.footer{padding:18px 24px}.category-grid{grid-template-columns:26px 64px minmax(100px,1fr) minmax(110px,1fr) 70px 170px;gap:12px;padding:0 14px}.dish-panel{padding:0 14px 16px 52px}.dish-grid{grid-template-columns:22px 65px minmax(120px,1fr) minmax(120px,1fr) 54px;gap:10px;padding:0 12px}.operations{gap:5px}.toolbar-note{display:none}}@media(max-width:700px){.modal{border-radius:16px}.modal-header h1{font-size:21px}.modal-header{padding:23px 18px 17px}.modal-header p{font-size:11px;line-height:1.7;max-width:265px}.toolbar{padding:0 18px 15px}.toolbar-title{font-size:13px}.toolbar>.button{padding:9px 11px;font-size:12px}.table-shell{margin:0 12px}.category-grid{grid-template-columns:18px 45px minmax(72px,1fr) 50px 82px;gap:6px;padding:0 10px}.category-grid>.en-name,.category-grid>.en-head,.operations .edit,.operations .delete{display:none}.operations .dish-toggle{font-size:11px;gap:3px}.operations-head{display:block}.category-name{font-size:12px}.category-row{min-height:64px}.row-controls{gap:0}.handle{padding:4px 0}.priority{width:43px;height:30px}.dish-count{gap:7px}.dish-count strong{font-size:12px}.dish-count .text-button{font-size:11px}.dish-panel{padding:0 10px 12px}.panel-top{gap:8px}.panel-subtitle{font-size:10px;line-height:1.7}.panel-heading{font-size:12px}.dish-grid{grid-template-columns:18px 52px minmax(90px,1fr) 38px;gap:8px;padding:0 10px}.dish-english,.dish-en-head{display:none}.dish-row .priority{width:42px}.dish-name{font-size:12px}.footer{padding:15px 14px;gap:8px}.save-status{font-size:10px;line-height:1.6}.panel-top .small{padding:7px 9px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toolbar-note .hint-grip{width:12px;height:18px;vertical-align:middle;margin:0 2px;color:inherit}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-grip" viewBox="0 0 16 24"><path d="M5 6h.01M11 6h.01M5 12h.01M11 12h.01M5 18h.01M11 18h.01" stroke-width="3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M16 3a2.2 2.2 0 0 1 3 3L10 15l-4 1 1-4Z"/></symbol>
<symbol id="i-delete" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/></symbol>
</defs></svg>
<div class="workspace" aria-hidden="true"><div class="brand">餐饮管理</div><div class="rail">工作台<br>菜品管理<br>订单管理<br>门店设置</div><div class="background-card">菜品管理</div></div>
<div class="backdrop"></div>
<main class="modal" aria-label="分类管理">
  <header class="modal-header"><div><h1>分类与菜品优先级管理</h1><p>统一管理分类顺序与菜品优先级，让每一道菜出现在合适的位置。</p></div><button class="icon-button close" id="close" aria-label="关闭分类管理"><svg><use href="#i-close"/></svg></button></header>
  <div class="toolbar"><div class="toolbar-title">全部分类 <span class="count" id="category-count"></span><span class="toolbar-note">拖拽 <svg class="hint-grip" role="img" aria-label="拖拽手柄"><use href="#i-grip"/></svg> 调整分类顺序，「展开菜品」管理分类内菜品</span></div><button class="button primary" id="add-category"><svg><use href="#i-plus"/></svg>新增分类</button></div>
  <section class="table-shell" aria-label="分类及菜品排序列表" id="table-shell">
    <div class="category-grid table-head"><span></span><span>优先级</span><span>名称（中文）</span><span class="en-head">名称（英文）</span><span>包含菜品</span><span class="operations-head">操作</span></div>
    <div id="categories"></div>
  </section>
  <footer class="footer"><div class="save-status" id="save-status" aria-live="polite"><span class="status-dot"></span><span id="status-text">调整后自动保存</span></div></footer>
</main>
<div class="reopen"><button class="button primary" id="reopen">打开分类管理</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="editor"><form class="dialog-content" id="editor-form"><h2 id="editor-title"></h2><p id="editor-description"></p><label class="field">名称（中文）<input id="name-cn" required maxlength="40" autocomplete="off" placeholder="请输入中文名称"></label><label class="field">名称（英文）<input id="name-en" maxlength="90" autocomplete="off" placeholder="请输入英文名称（选填）"></label><div class="dialog-actions"><button type="button" class="button" id="editor-cancel">取消</button><button class="button primary" type="submit">确定</button></div></form></dialog>
<dialog id="confirm"><div class="dialog-content"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button class="button" id="confirm-cancel">取消</button><button class="button primary" id="confirm-ok">删除分类</button></div></div></dialog>
<script>
'use strict';
const STORAGE_KEY='dish-category-priority-demo-v1';
const initial=[
  {id:'c1',name:'招牌必点菜',en:'Signature Must-Try Dishes',dishes:[['招牌脆皮烤鸭','Signature Crispy Roast Duck'],['金牌蒜香排骨','Golden Garlic Pork Ribs'],['松鼠桂鱼','Sweet & Sour Mandarin Fish'],['黑椒牛仔骨','Black Pepper Beef Short Ribs'],['宫保鸡丁','Kung Pao Chicken'],['干烧大虾','Braised King Prawns']]},
  {id:'c2',name:'当家拿手菜',en:'House Specialties',dishes:[['红烧肉','Braised Pork Belly'],['小炒黄牛肉','Stir-Fried Beef'],['干锅花菜','Dry Pot Cauliflower'],['香煎豆腐','Pan-Fried Tofu']]},
  {id:'c3',name:'川味盐帮菜',en:'Sichuan Yanbang Classics',dishes:[['水煮牛肉','Sichuan Poached Beef'],['辣子鸡','Sichuan Chili Chicken'],['鲜椒兔','Rabbit with Fresh Chilies'],['麻婆豆腐','Mapo Tofu'],['回锅肉','Twice-Cooked Pork']]},
  {id:'c4',name:'凉菜系列',en:'Cold Appetizers',dishes:[['口水鸡','Chicken in Chili Sauce'],['拍黄瓜','Smashed Cucumber'],['夫妻肺片','Sliced Beef in Chili Sauce']]},
  {id:'c5',name:'小炒素菜',en:'Stir-Fried Vegetables',dishes:[['清炒时蔬','Seasonal Greens'],['手撕包菜','Stir-Fried Cabbage'],['地三鲜','Eggplant, Potato & Pepper']]},
  {id:'c6',name:'特色面食',en:'Specialty Noodles',dishes:[['担担面','Dan Dan Noodles'],['红油抄手','Wontons in Chili Oil']]},
  {id:'c7',name:'汤羹',en:'Soups',dishes:[['菌菇鸡汤','Chicken & Mushroom Soup'],['酸辣汤','Hot & Sour Soup']]},
  {id:'c8',name:'主食',en:'Staple Foods',dishes:[['五常米饭','Steamed Rice'],['扬州炒饭','Yangzhou Fried Rice']]}
].map(c=>({...c,dishes:c.dishes.map((d,i)=>({id:c.id+'d'+(i+1),name:d[0],en:d[1]}))}));
const copy=x=>JSON.parse(JSON.stringify(x));
let data=copy(initial),saved,opened=new Set(['c1']),drag=null,editorContext=null,confirmAction=null,toastTimer;
let restored=false;
try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(value)&&value.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&typeof c.en==='string'&&Array.isArray(c.dishes)&&c.dishes.every(d=>typeof d.id==='string'&&typeof d.name==='string'&&typeof d.en==='string'))){data=value;restored=true;}}catch{}
saved=copy(data);
const $=s=>document.querySelector(s);
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2700);}
function persistChanges(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));saved=copy(data);restored=true;updateStatus();return true;}catch{data=copy(saved);updateStatus('自动保存失败，已恢复上次保存的内容');toast('自动保存失败，本次修改未生效，请重试');return false;}}
function updateStatus(message){$('#save-status').className='save-status '+(message?'error':restored?'saved':'');$('#status-text').textContent=message||(restored?'已自动保存至当前浏览器':'调整后自动保存');}
function priority(kind,id,index,max,category=''){return `<input class="priority" type="number" inputmode="numeric" min="1" max="${max}" step="1" value="${index+1}" data-kind="${kind}" data-id="${escapeHtml(id)}" data-category="${escapeHtml(category)}" aria-label="${kind==='category'?'分类':'菜品'}优先级，第 ${index+1} 位" title="输入 1–${max} 的整数，回车或移开焦点生效">`;}
function grip(kind,id,category=''){return `<button class="handle" draggable="true" data-kind="${kind}" data-id="${escapeHtml(id)}" data-category="${escapeHtml(category)}" aria-label="拖动${kind==='category'?'分类':'菜品'}排序，也可按上下方向键调整" title="拖动排序 · 支持键盘 ↑↓">${icon('grip')}</button>`;}
function render(highlight){
 const scroll=$('#table-shell').scrollTop;
 $('#category-count').textContent=data.length+' 个';
 $('#categories').innerHTML=data.length?data.map((c,index)=>{
  const open=opened.has(c.id),cid=escapeHtml(c.id);
  return `<section class="category ${open?'open':''}" data-category="${cid}">
   <div class="category-grid category-row" data-kind="category" data-id="${cid}">
    <div class="row-controls">${grip('category',c.id)}</div>
    <div>${priority('category',c.id,index,data.length)}</div><span class="category-name">${escapeHtml(c.name)}</span><span class="en-name">${escapeHtml(c.en)||'—'}</span>
    <div class="dish-count"><strong>${c.dishes.length}</strong></div>
    <div class="operations"><button class="text-button dish-toggle" data-action="toggle" data-category="${cid}" aria-expanded="${open}" aria-label="${open?'折叠':'展开'}${escapeHtml(c.name)}的菜品">${icon('chevron')}${open?'折叠菜品':'展开菜品'}</button><button class="icon-button edit" data-action="edit-category" data-category="${cid}" title="编辑分类" aria-label="编辑${escapeHtml(c.name)}">${icon('edit')}</button><button class="icon-button delete" data-action="delete-category" data-category="${cid}" ${c.dishes.length?'disabled':''} title="${c.dishes.length?'分类下有菜品，暂不可删除':'删除空分类'}" aria-label="删除${escapeHtml(c.name)}">${icon('delete')}</button></div>
   </div>
   ${open?`<div class="dish-panel"><div class="panel-top"><div><div class="panel-heading">${icon('list')}菜品优先级 <span class="count">${c.dishes.length} 道</span></div></div></div>
    <div class="dish-table"><div class="dish-grid dish-head"><span></span><span>优先级</span><span>菜品名称（中文）</span><span class="dish-en-head">菜品名称（英文）</span><span>操作</span></div>
    ${c.dishes.length?c.dishes.map((d,i)=>`<div class="dish-grid dish-row ${highlight===d.id?'changed-row':''}" data-kind="dish" data-id="${escapeHtml(d.id)}" data-category="${cid}">${grip('dish',d.id,c.id)}<div>${priority('dish',d.id,i,c.dishes.length,c.id)}</div><span class="dish-name">${escapeHtml(d.name)}</span><span class="dish-english">${escapeHtml(d.en)||'—'}</span><button class="text-button" data-action="top" data-category="${cid}" data-id="${escapeHtml(d.id)}" ${i===0?'disabled':''}>置顶</button></div>`).join(''):'<div class="empty">该分类暂无菜品，请前往菜品管理添加并关联此分类。</div>'}</div></div>`:''}
  </section>`;
 }).join(''):'<div class="empty">还没有分类，点击「新增分类」开始管理。</div>';
 $('#table-shell').scrollTop=scroll;
}
function getList(kind,category){return kind==='category'?data:data.find(c=>c.id===category)?.dishes;}
function move(kind,id,category,to){const list=getList(kind,category);if(!list)return false;const from=list.findIndex(x=>x.id===id);if(from<0||to<0||to>=list.length||from===to)return false;const[item]=list.splice(from,1);list.splice(to,0,item);const ok=persistChanges();render(ok?id:undefined);if(ok)toast(`「${item.name}」已移至第 ${to+1} 位，已自动保存`);return ok;}
$('#categories').addEventListener('change',e=>{const input=e.target;if(!input.matches('.priority'))return;const{kind,id,category}=input.dataset,list=getList(kind,category),from=list.findIndex(x=>x.id===id),raw=input.value.trim(),n=Number(raw);if(!raw||!Number.isInteger(n)||n<1||n>list.length){input.value=from+1;toast(`请输入 1–${list.length} 的整数，原顺序已保留`);return;}move(kind,id,category,n-1);});
$('#categories').addEventListener('keydown',e=>{if(e.target.matches('.priority')&&e.key==='Enter'){e.preventDefault();e.target.blur();}if(e.target.matches('.handle')&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const{kind,id,category}=e.target.dataset,list=getList(kind,category),from=list.findIndex(x=>x.id===id);move(kind,id,category,from+(e.key==='ArrowUp'?-1:1));[...document.querySelectorAll('.handle')].find(x=>x.dataset.id===id)?.focus();}});
function showEditor(mode,category){if(!['add-category','edit-category'].includes(mode))return;editorContext={mode,category};const c=data.find(x=>x.id===category);$('#editor-form').reset();$('#editor-title').textContent=mode==='edit-category'?'编辑分类':'新增分类';$('#editor-description').textContent=mode==='edit-category'?'修改分类名称，分类及菜品顺序保持不变。':'新分类将默认添加到分类列表末尾。';if(mode==='edit-category'){$('#name-cn').value=c.name;$('#name-en').value=c.en;}$('#editor').showModal();$('#name-cn').focus();}
function ask(title,description,label,action){$('#confirm-title').textContent=title;$('#confirm-description').textContent=description;$('#confirm-ok').textContent=label;confirmAction=action;$('#confirm').showModal();}
$('#categories').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const{action,category,id}=b.dataset;if(action==='toggle'){if(opened.has(category))opened.delete(category);else opened.add(category);render();}else if(action==='top')move('dish',id,category,0);else if(action==='delete-category'){const c=data.find(x=>x.id===category);if(c.dishes.length)return;ask('删除分类',`确定删除空分类「${c.name}」？删除后立即生效。`,'删除分类',()=>{data=data.filter(x=>x.id!==category);const ok=persistChanges();if(ok)opened.delete(category);render();if(ok)toast('分类已删除');});}else showEditor(action,category);});
$('#add-category').onclick=()=>showEditor('add-category');
$('#editor-cancel').onclick=()=>$('#editor').close();
$('#editor-form').onsubmit=e=>{e.preventDefault();const name=$('#name-cn').value.trim(),en=$('#name-en').value.trim();if(!name){$('#name-cn').setCustomValidity('请输入中文名称');$('#name-cn').reportValidity();return;}const{mode,category}=editorContext;let id;if(mode==='add-category'){id=uid();data.push({id,name,en,dishes:[]});}else if(mode==='edit-category'){const c=data.find(x=>x.id===category);c.name=name;c.en=en;}else return;if(!persistChanges()){render();return;}if(id)opened.add(id);$('#editor').close();render(id);toast(mode==='add-category'?'新分类已添加至列表末尾，已自动保存':'分类名称已更新，已自动保存');if(mode==='add-category')$('#table-shell').scrollTop=$('#table-shell').scrollHeight;};
$('#name-cn').oninput=e=>e.target.setCustomValidity('');
$('#confirm-cancel').onclick=()=>$('#confirm').close();
$('#confirm-ok').onclick=()=>{$('#confirm').close();confirmAction?.();confirmAction=null;};
function clearDrop(){document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));}
$('#categories').addEventListener('dragstart',e=>{const handle=e.target.closest('.handle');if(!handle)return;drag={...handle.dataset};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.id);const row=handle.closest('.dish-row,.category-row');e.dataTransfer.setDragImage(row,45,25);setTimeout(()=>row.classList.add('dragging'),0);});
$('#categories').addEventListener('dragover',e=>{if(!drag)return;const row=e.target.closest(drag.kind==='dish'?'.dish-row':'.category-row');clearDrop();if(!row||row.dataset.id===drag.id)return;if(drag.kind==='dish'&&row.dataset.category!==drag.category){e.dataTransfer.dropEffect='none';return;}e.preventDefault();e.dataTransfer.dropEffect='move';const rect=row.getBoundingClientRect();row.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');});
$('#categories').addEventListener('drop',e=>{if(!drag)return;e.preventDefault();const row=e.target.closest(drag.kind==='dish'?'.dish-row':'.category-row');if(row&&row.dataset.id!==drag.id&&(drag.kind==='category'||row.dataset.category===drag.category)){const list=getList(drag.kind,drag.category),from=list.findIndex(x=>x.id===drag.id),target=list.findIndex(x=>x.id===row.dataset.id),rect=row.getBoundingClientRect();let to=target+(e.clientY>=rect.top+rect.height/2?1:0);if(from<to)to--;move(drag.kind,drag.id,drag.category,to);}clearDrop();drag=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));});
document.addEventListener('dragend',()=>{drag=null;clearDrop();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));});
$('#close').onclick=()=>document.body.classList.add('closed');$('#reopen').onclick=()=>document.body.classList.remove('closed');
render();updateStatus();
</script>
</body>
